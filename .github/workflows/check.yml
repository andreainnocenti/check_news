name: Controllo notizie AS Roma

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: roma-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Controlla le notizie
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Parole chiave separate da virgola. Aggiungi il nome dell'avversario se vuoi.
          KEYWORDS: "bigliett,ticket,champions,psg,parigi,paris"
          REPEAT: "4"
        run: python3 check.py

      - name: Salva lo stato
        run: |
          git config user.name "roma-bot"
          git config user.email "roma-bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "aggiorna notizie viste" && git push)
